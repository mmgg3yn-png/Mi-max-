plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mimax.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.mimax.ai"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
