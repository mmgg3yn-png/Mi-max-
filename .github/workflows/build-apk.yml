name: Build IMGmiax APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Diagnose Java and Gradle
        shell: bash
        run: |
          echo "=== Java ==="
          java -version
          echo "=== Relevant environment variables ==="
          env | grep -E '^(JAVA_OPTS|GRADLE_OPTS|JAVA_TOOL_OPTIONS|JDK_JAVA_OPTIONS|_JAVA_OPTIONS|JAVA_HOME|GRADLE_USER_HOME)=' || true
          echo "=== Gradle wrapper JVM settings ==="
          grep -n -E 'DEFAULT_JVM_OPTS|JAVA_OPTS|JAVACMD|eval set|CLASSPATH' gradlew || true
          echo "=== Gradle wrapper version ==="
          bash -x ./gradlew --version

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IMGmiax-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
